<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paradores Concierge (Groq)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f0e8;
      color: #1e2420;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .box {
      width: 100%;
      max-width: 780px;
      background: #ffffff;
      border: 1px solid #d8cfc0;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }
    .top {
      background: #1e2420;
      color: #ffffff;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .brand-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-logo {
      height: 24px;
      width: auto;
      display: block;
    }
    .controls {
      padding: 12px 18px;
      background: #faf7f2;
      border-bottom: 1px solid #e5ddd0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chips {
      padding: 10px 18px;
      background: #f2ece1;
      border-bottom: 1px solid #e5ddd0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .messages {
      height: 380px;
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fcfbf8;
    }
    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 8px;
      white-space: pre-wrap;
      line-height: 1.45;
      font-size: 14px;
    }
    .user {
      align-self: flex-end;
      background: #283b31;
      color: #ffffff;
    }
    .bot {
      align-self: flex-start;
      background: #ffffff;
      border: 1px solid #ddd4c5;
      color: #1e2420;
    }
    form {
      display: flex;
      gap: 8px;
      padding: 12px 18px;
      border-top: 1px solid #e5ddd0;
      background: #ffffff;
    }
    input {
      padding: 9px 12px;
      border: 1px solid #cfc4b2;
      border-radius: 6px;
      font-size: 14px;
    }
    form input { flex: 1; }
    button {
      padding: 9px 14px;
      border: none;
      border-radius: 6px;
      background: #8c6239;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
    }
    button.alt {
      background: #ffffff;
      color: #1e2420;
      border: 1px solid #cfc4b2;
      font-weight: normal;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="top">
      <div class="brand-left">
        <img
          src="./paradores_logo-dark.svg"
          alt="Paradores"
          class="brand-logo"
          onerror="this.style.display='none';"
        />
        <strong>PARADORES · Digital Concierge</strong>
      </div>
      <span id="statusText">Mode: Ready</span>
    </div>

    <div class="controls">
      <input type="password" id="apiKey" placeholder="Groq API Key (gsk_...)" />
      <button type="button" class="alt" id="demoBtn">Demo Mode: OFF</button>
      <button type="button" class="alt" id="clearBtn">Clear</button>
    </div>

    <div class="chips" id="chips">
      <button type="button" class="alt" data-q="How do I book a Parador stay step by step?">How to Book</button>
      <button type="button" class="alt" data-q="Tell me about Parador de Ciudad Rodrigo, Mérida, and Ibiza.">Historic Paradors</button>
      <button type="button" class="alt" data-q="What regional dishes can I try at Mérida, Albacete, or Antequera?">Regional Gastronomy</button>
      <button type="button" class="alt" data-q="How does Amigos de Paradores work and what are the cancellation rules?">Amigos &amp; Cancellation</button>
    </div>

    <div class="messages" id="messages">
      <div class="msg bot">Welcome to the Paradores Digital Concierge. Paste your Groq API key above for live AI replies, or toggle Demo Mode ON for instant backup answers.</div>
    </div>

    <form id="chatForm">
      <input type="text" id="userInput" placeholder="Ask about booking, Paradors, food, or Amigos..." required />
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>

  <script>
    (function () {
      const messagesEl = document.getElementById("messages");
      const formEl = document.getElementById("chatForm");
      const inputEl = document.getElementById("userInput");
      const apiKeyEl = document.getElementById("apiKey");
      const demoBtn = document.getElementById("demoBtn");
      const clearBtn = document.getElementById("clearBtn");
      const chipsEl = document.getElementById("chips");
      const sendBtn = document.getElementById("sendBtn");
      const statusText = document.getElementById("statusText");

      const GROQ_ENDPOINT = "https://api.groq.com/openai/v1/chat/completions";
      const GROQ_MODELS = ["openai/gpt-oss-120b", "openai/gpt-oss-20b", "qwen/qwen3.8-27b"];
      const SYSTEM_TEXT =
        "You are the Paradores Digital Concierge for Spain's Paradores hotels, regional gastronomy, booking rules, and Amigos de Paradores. Keep answers clear, helpful, and accurate.";

      let demoOn = false;
      let history = [];

      function updateLabel() {
        demoBtn.textContent = demoOn ? "Demo Mode: ON" : "Demo Mode: OFF";
        statusText.textContent = demoOn ? "Mode: Instant Demo" : "Mode: Live Groq";
      }

      demoBtn.onclick = function () {
        demoOn = !demoOn;
        updateLabel();
      };

      clearBtn.onclick = function () {
        history = [];
        messagesEl.innerHTML = '<div class="msg bot">Chat cleared. How can I help with Paradores?</div>';
      };

      chipsEl.onclick = function (e) {
        if (e.target && e.target.dataset.q) {
          inputEl.value = e.target.dataset.q;
          formEl.dispatchEvent(new Event("submit", { cancelable: true }));
        }
      };

      function addMsg(text, who) {
        const div = document.createElement("div");
        div.className = "msg " + who;
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
      }

      function localAnswer(q) {
        const s = q.toLowerCase();
        if (s.includes("book") || s.includes("reserve")) {
          return "How to Book a Parador:\n1. Pick a Parador (Ciudad Rodrigo, Mérida, Ibiza, etc.) and dates.\n2. Choose your room and rate (sign in as an Amigo if using Amigo rates/points).\n3. Book on paradores.es, via the Paradores app, directly with the Parador, or via Central Reservations (reservas@parador.es / +34 91 374 25 00).\n4. Standard bookings generally allow changes/cancellations more than 2 days before arrival unless non-refundable (such as Early Booking).";
        }
        if (s.includes("cancel") || s.includes("change")) {
          return "Changes & Cancellations:\n• Manage bookings through paradores.es, Central Reservations (reservas@parador.es / +34 91 374 25 00), or the Parador.\n• Standard rates generally allow changes/cancellations more than 2 days before arrival; non-refundable rates like Early Booking cannot be cancelled.";
        }
        if (s.includes("amigo") || s.includes("loyalty") || s.includes("point")) {
          return "Amigos de Paradores:\n• Free program with Standard, Gold, and Circle tiers.\n• Includes a 5% Amigo web rate discount, points on stays/services, and welcome perks.";
        }
        if (s.includes("food") || s.includes("dish") || s.includes("gastronom") || s.includes("albacete") || s.includes("antequera")) {
          return "Regional Gastronomy:\n• Mérida: Iberian pork, Dehesa ham, and traditional stews.\n• Albacete: Migas ruleras, pisto manchego, and Manchegan dishes.\n• Antequera: Porra antequerana, pío antequerano, and bienmesabe.";
        }
        return "Featured Paradors:\n• Ciudad Rodrigo: 1372 castle overlooking the Águeda river in Salamanca.\n• Mérida: 1725 Baroque monastery over Roman ruins.\n• Ibiza (Dalt Vila): Historic hilltop setting overlooking the Mediterranean and port.";
      }

      async function askGroq(key, promptText) {
        const nextHistory = [...history, { role: "user", content: promptText }];
        const errors = [];

        for (const model of GROQ_MODELS) {
          const ctrl = new AbortController();
          const tid = setTimeout(() => ctrl.abort(), 9000);
          try {
            const res = await fetch(GROQ_ENDPOINT, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + key
              },
              signal: ctrl.signal,
              body: JSON.stringify({
                model: model,
                messages: [{ role: "system", content: SYSTEM_TEXT }, ...nextHistory],
                temperature: 0.4,
                max_completion_tokens: 800
              })
            });
            const data = await res.json().catch(() => ({}));
            const out = data && data.choices && data.choices[0] && data.choices[0].message
              ? data.choices[0].message.content
              : "";
            if (res.ok && out && out.trim()) {
              history = [...nextHistory, { role: "assistant", content: out.trim() }];
              return out.trim();
            }
            errors.push(model + ": " + (data.error && data.error.message ? data.error.message : "HTTP " + res.status));
          } catch (err) {
            errors.push(model + ": " + (err && err.name === "AbortError" ? "Timed out after 9s" : err.message || String(err)));
          } finally {
            clearTimeout(tid);
          }
        }

        throw new Error(errors.join(" | "));
      }

      formEl.addEventListener("submit", async function (e) {
        e.preventDefault();
        const q = inputEl.value.trim();
        if (!q) return;

        addMsg(q, "user");
        inputEl.value = "";
        sendBtn.disabled = true;
        const botBubble = addMsg("Thinking...", "bot");

        try {
          const key = apiKeyEl.value.trim();
          if (demoOn || !key) {
            botBubble.textContent = localAnswer(q);
          } else {
            botBubble.textContent = await askGroq(key, q);
          }
        } catch (err) {
          demoOn = true;
          updateLabel();
          botBubble.textContent =
            localAnswer(q) +
            "\n\n(Switched to Demo Mode automatically — Live API note: " +
            (err && err.message ? err.message : String(err)) +
            ")";
        } finally {
          sendBtn.disabled = false;
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
      });

      updateLabel();
    })();
  </script>
</body>
</html>
