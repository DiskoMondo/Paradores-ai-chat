<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Paradores Concierge (Groq)</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f0e8;
      color: #1e2420;
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }
    .box {
      width: 100%;
      max-width: 780px;
      background: #ffffff;
      border: 1px solid #d8cfc0;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
    }
    .top {
      background: #1e2420;
      color: #ffffff;
      padding: 12px 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }
    .brand-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-logo {
      height: 24px;
      width: auto;
      display: block;
    }
    .controls {
      padding: 12px 18px;
      background: #faf7f2;
      border-bottom: 1px solid #e5ddd0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .chips {
      padding: 10px 18px;
      background: #f2ece1;
      border-bottom: 1px solid #e5ddd0;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }
    .messages {
      height: 380px;
      overflow-y: auto;
      padding: 16px 18px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #fcfbf8;
    }
    .msg {
      max-width: 82%;
      padding: 10px 14px;
      border-radius: 8px;
      white-space: pre-wrap;
      line-height: 1.45;
      font-size: 14px;
    }
    .user {
      align-self: flex-end;
      background: #283b31;
      color: #ffffff;
    }
    .bot {
      align-self: flex-start;
      background: #ffffff;
      border: 1px solid #ddd4c5;
      color: #1e2420;
    }
    form {
      display: flex;
      gap: 8px;
      padding: 12px 18px;
      border-top: 1px solid #e5ddd0;
      background: #ffffff;
    }
    input {
      padding: 9px 12px;
      border: 1px solid #cfc4b2;
      border-radius: 6px;
      font-size: 14px;
    }
    form input { flex: 1; }
    button {
      padding: 9px 14px;
      border: none;
      border-radius: 6px;
      background: #8c6239;
      color: #ffffff;
      font-weight: bold;
      cursor: pointer;
    }
    button.alt {
      background: #ffffff;
      color: #1e2420;
      border: 1px solid #cfc4b2;
      font-weight: normal;
    }
  </style>
</head>
<body>
  <div class="box">
    <div class="top">
      <div class="brand-left">
        <img
          src="./paradores_logo-dark.svg"
          alt="Paradores"
          class="brand-logo"
          onerror="this.style.display='none';"
        />
        <strong>PARADORES · Digital Concierge</strong>
      </div>
      <span id="statusText">Mode: Ready</span>
    </div>

    <div class="controls">
      <input type="password" id="apiKey" placeholder="Groq API Key (gsk_...)" />
      <button type="button" class="alt" id="demoBtn">Demo Mode: OFF</button>
      <button type="button" class="alt" id="clearBtn">Clear</button>
    </div>

    <div class="chips" id="chips">
      <button type="button" class="alt" data-q="How do I book a Parador stay step by step?">How to Book</button>
      <button type="button" class="alt" data-q="Tell me about Parador de Ciudad Rodrigo, Mérida, Ibiza, and Granada.">Historic Paradors</button>
      <button type="button" class="alt" data-q="What regional dishes and restaurants can I try at Mérida, León, Santiago, or Antequera?">Regional Gastronomy</button>
      <button type="button" class="alt" data-q="How does the Amigos de Paradores program work, including tiers, points, and cancellation rules?">Amigos &amp; Cancellation</button>
    </div>

    <div class="messages" id="messages">
      <div class="msg bot">Welcome to the Paradores Digital Concierge. Paste your Groq API key above for live AI replies, or toggle Demo Mode ON for instant backup answers.</div>
    </div>

    <form id="chatForm">
      <input type="text" id="userInput" placeholder="Ask about booking, Paradors, food, or Amigos..." required />
      <button type="submit" id="sendBtn">Send</button>
    </form>
  </div>

  <script>
    (function () {
      const messagesEl = document.getElementById("messages");
      const formEl = document.getElementById("chatForm");
      const inputEl = document.getElementById("userInput");
      const apiKeyEl = document.getElementById("apiKey");
      const demoBtn = document.getElementById("demoBtn");
      const clearBtn = document.getElementById("clearBtn");
      const chipsEl = document.getElementById("chips");
      const sendBtn = document.getElementById("sendBtn");
      const statusText = document.getElementById("statusText");

      const GROQ_ENDPOINT = "https://api.groq.com/openai/v1/chat/completions";
      const GROQ_MODELS = ["openai/gpt-oss-120b", "openai/gpt-oss-20b", "llama-3.3-70b-versatile"];
      const SYSTEM_TEXT = `
You are the Digital Concierge for Paradores de Turismo (paradores.es), Spain's network of historic, cultural, and nature hotels, restaurants, and experiences.

Accurate program & policy knowledge:
1. Amigos de Paradores:
   - Free to join for guests aged 18+; no base membership expiration, though points expire after 24 months without a qualifying accommodation movement on the account (restaurant/spa/shop bills alone or point-only stays do not extend point validity).
   - Earning points: Book directly (paradores.es, Paradores app, Reservations Centre, Parador, or traditional travel agency) and identify as an Amigo—third-party OTAs (such as Booking.com or Expedia) do not earn points. Earn 1 point per €3 on eligible accommodation, restaurant, bar, spa, and shop spend (excluding taxes), and 1 point per €12 on special events. Only one loyalty program per invoice.
   - Tiers & key perks:
     * Amigo (entry): 5% Amigo web rate discount when logged in, welcome drink, €5 off basic spa circuit during a stay, 15% off Gastroparada, and a first-booking free buffet breakfast promo code (valid to book within 6 months and stay within the first year).
     * Oro (Gold): 1,500–2,999 points plus at least 3 qualifying stays at different Paradors over the prior 2 calendar years; adds 50% off buffet breakfast for cardholder + 1 companion sharing the room, €5 off parking/garage when staying, and 10% off lunch (not staying) for cardholder + 1 companion.
     * Círculo de Paradores: 3,000+ points plus at least 5 stays at different Paradors over the prior 2 years; adds free buffet breakfast all year for cardholder + 1 companion sharing the room, free garage parking when staying, 20% off lunch (not staying) + 15% Gastroparada discount, welcome room gift, priority arrival, and dedicated customer service.
   - Redeeming points: Personal and non-transferable; can be used for free nights (starting around 310+ points depending on Parador/season; excludes Dec 30–31 and extra beds/third-person breakfast in euros) or Gift Boxes (from 320 points). Points are deducted at stay/checkout (oldest first). Late cancellation or no-show on a reward night may deduct 1 night's points or charge €0.35 per point.

2. Bookings, Cancellations & Gift Boxes:
   - Book via paradores.es, the Paradores app, directly with the Parador, Central Reservations (reservas@parador.es / +34 91 374 25 00; Amigos support: amigos@parador.es / +34 91 374 26 00), or a travel agency.
   - Standard bookings generally allow changes or cancellations more than 2 days before arrival (from 00:00), though certain dates/Paradores have longer windows. Non-refundable rates (such as Early Booking) cannot be changed or cancelled. For rooms with >3 guests or pet stays, contact the Parador directly.
   - Gift Boxes: Not extendable; refundable within 15 days of purchase; physical boxes arrive within up to 7 working days (digital vouchers are available immediately).

3. Featured Paradors & Regional Gastronomy:
   - Ciudad Rodrigo (Salamanca): 1372 castle overlooking the Águeda river; Guijuelo ham, Iberian pork, farinato.
   - Mérida (Badajoz): 1725 Baroque Convento de Jesús with Roman ruins/Garden of Antiquities; La Alacena del Foro restaurant; acorn-fed ham, Corderex lamb, Iberian pork.
   - Ibiza (Eivissa - Dalt Vila): Historic hilltop setting in UNESCO Dalt Vila with Mediterranean and port views.
   - Granada: Historic Alhambra grounds with Moorish heritage and Sierra Nevada nearby.
   - León (Hostal San Marcos): Renaissance landmark; Restaurant Rey Don Sancho featuring cecina, León black pudding, and suckling lamb.
   - Santiago de Compostela (Hostal dos Reis Católicos): Historic pilgrimage landmark; Restaurant dos Reis.
   - Antequera & Albacete: Porra antequerana, pío antequerano, and bienmesabe in Antequera; migas ruleras and Manchegan cuisine in Albacete.

Keep answers clear, accurate, well-structured, and helpful.
`.trim();

      let demoOn = false;
      let history = [];

      function updateLabel() {
        demoBtn.textContent = demoOn ? "Demo Mode: ON" : "Demo Mode: OFF";
        statusText.textContent = demoOn ? "Mode: Instant Demo" : "Mode: Live Groq";
      }

      demoBtn.onclick = function () {
        demoOn = !demoOn;
        updateLabel();
      };

      clearBtn.onclick = function () {
        history = [];
        messagesEl.innerHTML = '<div class="msg bot">Chat cleared. How can I help with Paradores?</div>';
      };

      chipsEl.onclick = function (e) {
        if (e.target && e.target.dataset.q) {
          inputEl.value = e.target.dataset.q;
          formEl.dispatchEvent(new Event("submit", { cancelable: true }));
        }
      };

      function addMsg(text, who) {
        const div = document.createElement("div");
        div.className = "msg " + who;
        div.textContent = text;
        messagesEl.appendChild(div);
        messagesEl.scrollTop = messagesEl.scrollHeight;
        return div;
      }

      function localAnswer(q) {
        const s = q.toLowerCase();

        if (
          s.includes("amigo") ||
          s.includes("loyalty") ||
          s.includes("point") ||
          s.includes("tier") ||
          s.includes("oro") ||
          s.includes("gold") ||
          s.includes("circulo") ||
          s.includes("círculo") ||
          s.includes("breakfast")
        ) {
          return (
            "Amigos de Paradores Guide:\n" +
            "• Joining is free (18+); points are earned on direct bookings (1 pt per €3 on eligible stay/dining/spa/shop spend; 1 pt per €12 on special events) and expire after 24 months without a qualifying accommodation movement.\n" +
            "• Amigo (Entry): 5% web Amigo discount when logged in, welcome drink, €5 off basic spa circuit on stays, 15% off Gastroparada, and a first-booking free buffet breakfast promo code (book within 6 months, stay within 1 year).\n" +
            "• Oro (Gold): 1,500–2,999 pts + 3 stays at different Paradors over 2 years; adds 50% off buffet breakfast (for cardholder + 1 companion sharing room), €5 off parking/garage on stays, and 10% off lunch (not staying).\n" +
            "• Círculo: 3,000+ pts + 5 stays at different Paradors over 2 years; adds free buffet breakfast all year (for cardholder + 1 companion sharing room), free garage parking on stays, 20% off lunch (not staying) + 15% Gastroparada, welcome room gift, and priority service.\n" +
            "• Redeeming: Free nights start around 310+ pts depending on Parador/season (excludes Dec 30–31), and Gift Boxes start from 320 pts (points deducted at checkout, oldest first)."
          );
        }

        if (s.includes("book") || s.includes("reserve")) {
          return (
            "How to Book a Parador:\n" +
            "1. Pick a Parador (Ciudad Rodrigo, Mérida, Ibiza, Granada, León, etc.) and dates.\n" +
            "2. Log in to Amigos de Paradores first if using the 5% Amigo web rate or redeeming points.\n" +
            "3. Book via paradores.es, the Paradores app, directly with the Parador, Central Reservations (reservas@parador.es / +34 91 374 25 00), or a travel agency.\n" +
            "4. Standard bookings generally allow changes/cancellations more than 2 days before arrival (from 00:00) unless non-refundable (such as Early Booking). For >3 guests or pets, contact the Parador directly."
          );
        }

        if (s.includes("cancel") || s.includes("change") || s.includes("gift box") || s.includes("refund")) {
          return (
            "Changes, Cancellations & Gift Boxes:\n" +
            "• Manage bookings through the channel where you reserved (paradores.es, reservas@parador.es / +34 91 374 25 00, the Parador, or your travel agency).\n" +
            "• Standard bookings generally allow changes/cancellations more than 2 days before arrival; non-refundable rates like Early Booking cannot be changed or cancelled.\n" +
            "• Gift Boxes are not extendable, can be refunded within 15 days of purchase, and arrive physically within up to 7 working days (or digitally right away)."
          );
        }

        if (
          s.includes("food") ||
          s.includes("dish") ||
          s.includes("gastronom") ||
          s.includes("restaurant") ||
          s.includes("albacete") ||
          s.includes("antequera") ||
          s.includes("leon") ||
          s.includes("león") ||
          s.includes("santiago")
        ) {
          return (
            "Regional Gastronomy & Restaurants:\n" +
            "• Mérida (La Alacena del Foro): Extremaduran acorn-fed ham, Corderex lamb, and Iberian pork.\n" +
            "• León (Rey Don Sancho): Cecina, León black pudding, and Castile & León suckling lamb.\n" +
            "• Santiago de Compostela (dos Reis): Galician classics and pilgrimage hospitality.\n" +
            "• Antequera & Albacete: Porra antequerana, pío antequerano, and bienmesabe in Antequera; migas ruleras and Manchegan dishes in Albacete."
          );
        }

        return (
          "Featured Paradors:\n" +
          "• Ciudad Rodrigo: 1372 castle overlooking the Águeda river in Salamanca.\n" +
          "• Mérida: 1725 Baroque monastery over Roman ruins with a Garden of Antiquities.\n" +
          "• Ibiza (Dalt Vila): Historic hilltop setting in UNESCO Dalt Vila overlooking the Mediterranean and port.\n" +
          "• Granada, León & Santiago de Compostela: Iconic monuments across Spain with rich history and regional dining."
        );
      }

      async function askGroq(key, promptText) {
        const nextHistory = [...history, { role: "user", content: promptText }];
        const errors = [];

        for (const model of GROQ_MODELS) {
          const ctrl = new AbortController();
          const tid = setTimeout(() => ctrl.abort(), 9000);
          try {
            const res = await fetch(GROQ_ENDPOINT, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + key
              },
              signal: ctrl.signal,
              body: JSON.stringify({
                model: model,
                messages: [{ role: "system", content: SYSTEM_TEXT }, ...nextHistory],
                temperature: 0.4,
                max_completion_tokens: 900
              })
            });
            const data = await res.json().catch(() => ({}));
            const out = data && data.choices && data.choices[0] && data.choices[0].message
              ? data.choices[0].message.content
              : "";
            if (res.ok && out && out.trim()) {
              history = [...nextHistory, { role: "assistant", content: out.trim() }];
              return out.trim();
            }
            errors.push(model + ": " + (data.error && data.error.message ? data.error.message : "HTTP " + res.status));
          } catch (err) {
            errors.push(model + ": " + (err && err.name === "AbortError" ? "Timed out after 9s" : err.message || String(err)));
          } finally {
            clearTimeout(tid);
          }
        }

        throw new Error(errors.join(" | "));
      }

      formEl.addEventListener("submit", async function (e) {
        e.preventDefault();
        const q = inputEl.value.trim();
        if (!q) return;

        addMsg(q, "user");
        inputEl.value = "";
        sendBtn.disabled = true;
        const botBubble = addMsg("Thinking...", "bot");

        try {
          const key = apiKeyEl.value.trim();
          if (demoOn || !key) {
            botBubble.textContent = localAnswer(q);
          } else {
            botBubble.textContent = await askGroq(key, q);
          }
        } catch (err) {
          demoOn = true;
          updateLabel();
          botBubble.textContent =
            localAnswer(q) +
            "\n\n(Switched to Demo Mode automatically — Live API note: " +
            (err && err.message ? err.message : String(err)) +
            ")";
        } finally {
          sendBtn.disabled = false;
          messagesEl.scrollTop = messagesEl.scrollHeight;
        }
      });

      updateLabel();
    })();
  </script>
</body>
</html>
