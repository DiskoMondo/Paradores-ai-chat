<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Chatbot Demo</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      margin: 0;
      background: #0f172a;
      color: #f8fafc;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 16px;
    }
    .app {
      width: 100%;
      max-width: 720px;
      height: 85vh;
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 14px;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.35);
    }
    .header {
      padding: 14px 18px;
      background: #0f172a;
      border-bottom: 1px solid #334155;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 600;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }
    input[type="password"], input[type="text"] {
      background: #1e293b;
      color: #f8fafc;
      border: 1px solid #475569;
      border-radius: 8px;
      padding: 7px 10px;
      font-size: 0.85rem;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    button.secondary { background: #334155; }
    button.secondary:hover { background: #475569; }
    .mode-badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 999px;
      background: #065f46;
      color: #d1fae5;
    }
    .mode-badge.fallback {
      background: #92400e;
      color: #fef3c7;
    }
    .chat-box {
      flex: 1;
      overflow-y: auto;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .msg {
      max-width: 82%;
      padding: 11px 14px;
      border-radius: 12px;
      line-height: 1.45;
      font-size: 0.94rem;
      white-space: pre-wrap;
    }
    .msg.user {
      align-self: flex-end;
      background: #2563eb;
      color: white;
      border-bottom-right-radius: 4px;
    }
    .msg.bot {
      align-self: flex-start;
      background: #334155;
      color: #f8fafc;
      border-bottom-left-radius: 4px;
    }
    .input-area {
      padding: 12px 16px;
      background: #0f172a;
      border-top: 1px solid #334155;
      display: flex;
      gap: 8px;
    }
    .input-area input {
      flex: 1;
      padding: 10px 12px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="header">
      <div>
        <h1>AI Assistant Demo</h1>
      </div>
      <div class="controls">
        <input type="password" id="apiKeyInput" placeholder="Paste Gemini API Key (session only)" />
        <button class="secondary" id="toggleDemoBtn" type="button">Demo Fallback: OFF</button>
        <button class="secondary" id="clearBtn" type="button">Clear</button>
      </div>
    </div>

    <div class="chat-box" id="chatBox">
      <div class="msg bot">Hi! Paste your Gemini API key above for live AI responses, or toggle Demo Fallback ON if you want offline/backup demo replies.</div>
    </div>

    <form class="input-area" id="chatForm">
      <input type="text" id="promptInput" placeholder="Ask something..." autocomplete="off" required />
      <button type="submit">Send</button>
    </form>
  </div>

  <script>
    const MODEL = "gemini-3.5-flash-lite";
    const SYSTEM_INSTRUCTION = "You are a helpful, concise assistant demonstrating AI capabilities during a presentation.";

    const chatBox = document.getElementById("chatBox");
    const chatForm = document.getElementById("chatForm");
    const promptInput = document.getElementById("promptInput");
    const apiKeyInput = document.getElementById("apiKeyInput");
    const toggleDemoBtn = document.getElementById("toggleDemoBtn");
    const clearBtn = document.getElementById("clearBtn");

    let demoFallback = false;
    let history = []; // Stores { role: "user" | "model", parts: [{ text }] }

    toggleDemoBtn.addEventListener("click", () => {
      demoFallback = !demoFallback;
      toggleDemoBtn.textContent = `Demo Fallback: ${demoFallback ? "ON" : "OFF"}`;
    });

    clearBtn.addEventListener("click", () => {
      history = [];
      chatBox.innerHTML = `<div class="msg bot">Chat cleared. Ready for the next prompt!</div>`;
    });

    function appendMessage(text, sender) {
      const div = document.createElement("div");
      div.className = `msg ${sender}`;
      div.textContent = text;
      chatBox.appendChild(div);
      chatBox.scrollTop = chatBox.scrollHeight;
      return div;
    }

    function getFallbackReply(userText) {
      const lower = userText.toLowerCase();
      if (lower.includes("hello") || lower.includes("hi")) {
        return "Hello! Welcome to the presentation. Ask me to summarize a topic, brainstorm ideas, or explain a concept.";
      }
      if (lower.includes("summarize") || lower.includes("summary")) {
        return "Summary points:\n1. Core idea is clear and modular.\n2. Live AI connects when a key is provided.\n3. Backup mode keeps the demo reliable anywhere.";
      }
      return `Demo Mode Response: I received "${userText}". In live mode, Gemini generates a real-time contextual answer using your conversation history.`;
    }

    async function callGemini(apiKey, userText) {
      history.push({ role: "user", parts: [{ text: userText }] });

      const url = `https://generativelanguage.googleapis.com/v1beta/models/${MODEL}:generateContent?key=${encodeURIComponent(apiKey)}`;
      const response = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: SYSTEM_INSTRUCTION }] },
          contents: history
        })
      });

      const data = await response.json();
      if (!response.ok) {
        history.pop();
        throw new Error(data.error?.message || `HTTP ${response.status}`);
      }

      const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || "No response text returned.";
      history.push({ role: "model", parts: [{ text: reply }] });
      return reply;
    }

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const text = promptInput.value.trim();
      if (!text) return;

      appendMessage(text, "user");
      promptInput.value = "";

      const thinkingMsg = appendMessage("Thinking...", "bot");
      const apiKey = apiKeyInput.value.trim();

      try {
        let reply;
        if (demoFallback || !apiKey) {
          reply = getFallbackReply(text);
          if (!apiKey && !demoFallback) {
            reply += "\n\n(Tip: Paste an API key above for live AI, or click 'Demo Fallback: OFF' to turn on offline replies.)";
          }
        } else {
          reply = await callGemini(apiKey, text);
        }
        thinkingMsg.textContent = reply;
      } catch (err) {
        thinkingMsg.textContent = `Live API error: ${err.message}\n\nTip: Click "Demo Fallback: OFF" to switch to instant backup mode.`;
      }
    });
  </script>
</body>
</html>
